name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          for f in *.sh; do
            bash -n "$f" && echo "OK   $f" || exit 1
          done

      - name: ShellCheck
        run: shellcheck -S warning *.sh

      - name: Generated-wrapper sanity check
        run: |
          # The installer generates wrapper scripts via heredocs; verify they
          # expand to valid bash for every supported desktop choice.
          for desktop in xfce mate; do
            BIN_DIR="$(mktemp -d)" \
            RESOLUTION="1366x768" \
            VNC_PORT=5901 \
            DISPLAY_NUM=1 \
            DISPLAY=":1" \
            SESSION_CMD="$([ "$desktop" = xfce ] && echo startxfce4 || echo mate-session)" \
            NOVNC_DIR="/opt/novnc" \
            bash -c '
              step() { :; }
              sed -n "/^step \"Writing service wrappers/,/^chmod +x \"\${BIN_DIR}\/run-password-api.sh\"/p" install.sh > /tmp/gen.sh
              source /tmp/gen.sh
            '
            for f in "$BIN_DIR"/run-*.sh; do
              bash -n "$f" || { echo "FAIL: $f ($desktop)"; exit 1; }
            done
            echo "OK   wrappers ($desktop)"
            rm -rf "$BIN_DIR"
          done

  web:
    name: Web clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inline JavaScript syntax check
        run: python3 scripts/check_inline_js.py web/*.html

      - name: No CDN dependencies in served pages
        run: |
          # vnc.html must load noVNC locally so it works offline/private networks
          if grep -nE "https?://(cdn|unpkg|jsdelivr)" web/vnc.html web/desktop.html; then
            echo "FAIL: served pages must not depend on CDNs"
            exit 1
          fi
          echo "OK   no CDN references"
